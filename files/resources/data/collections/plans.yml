# Column types for plans.json — the pricing tiers. Features are one per line; the Yearly columns show when the toggle is flipped.
fields:
    name: { type: text }
    description: { type: text }
    price: { type: text }
    priceYearly: { type: text }
    note: { type: text }
    noteYearly: { type: text }
    features: { type: textarea }
    ctaText: { type: text }
    ctaLink: { type: url }
    featured: { type: select, options: { yes: "Yes", no: "No" } }
