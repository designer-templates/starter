# The visual editor's contract for components/nav.blade.php — surfaces under
# the Layout tab. Field names are camelCase, matching the props they fill.
title: Navigation
description: The sticky top bar — brand, links with dropdown menus, Log in, and the primary call to action
fixed: true
fields:
    brand:
        type: text
        label: Brand name
        default: "Starter"
    links:
        type: repeater
        label: Navigation links
        description: "Nest links under an item to turn it into a dropdown. Stored in site.json."
        source: site.nav_links
        nestable: true
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
            description:
                type: text
                label: Description
                default: ""
    signInText:
        type: text
        label: Log in text
        description: Clear to hide.
        default: "Log in"
    signInLink:
        type: url
        label: Log in link
        default: "#"
    ctaText:
        type: text
        label: Primary button text
        description: Clear to hide.
        default: "Sign up"
    ctaLink:
        type: url
        label: Primary button link
        default: "/pricing"
