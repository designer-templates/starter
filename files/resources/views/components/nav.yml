# The visual editor's contract for components/nav.blade.php — surfaces under
# the Layout tab. Field names are camelCase, matching the props they fill.
title: Navigation
description: An announcement bar over the sticky top bar — brand, links with dropdown menus, Log in, and the primary call to action
fixed: true
fields:
    brand:
        type: text
        label: Brand name
        default: "Starter"
    links:
        type: repeater
        label: Navigation links
        description: "Nest links under an item to turn it into a dropdown. Stored in site.json."
        source: site.nav_links
        nestable: true
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
            description:
                type: text
                label: Description
                default: ""
    signInText:
        type: text
        label: Log in text
        description: Clear to hide.
        default: "Log in"
    signInLink:
        type: url
        label: Log in link
        default: "#"
    ctaText:
        type: text
        label: Primary button text
        description: Clear to hide.
        default: "Sign up"
    ctaLink:
        type: url
        label: Primary button link
        default: "/pricing"
    bannerMessage:
        type: text
        label: Announcement
        description: The thin dark bar above the header. Clear to remove it.
        default: "Version 4.2 is out — offline mode, instant search, and 12 new integrations."
    bannerLinkText:
        type: text
        label: Announcement link text
        description: Clear to hide the link.
        default: "Read the changelog"
    bannerLinkUrl:
        type: url
        label: Announcement link URL
        default: "/#features"
    bannerDismissible:
        type: toggle
        label: Show dismiss button
        default: "1"
