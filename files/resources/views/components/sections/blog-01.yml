title: Featured post and list
description: One featured post with its cover on the left, four more as a hairline-divided list on the right
category: blog
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "Blog"
    heading:
        type: text
        label: Heading
        required: true
        default: "Writing on pay, tips and the back office"
    intro:
        type: textarea
        label: Intro
        rows: 2
        default: "What the Outset team learns running payroll for 1,140 restaurants, written down before we forget it."
    linkText:
        type: text
        label: Link text
        default: "View all posts"
    linkUrl:
        type: url
        label: Link URL
        default: "/blog"
    posts:
        type: repeater
        label: Posts
        source: collections.posts
        add_button_label: Add post
        item_label: title
        sub_fields:
            title:
                type: text
                label: Title
            excerpt:
                type: textarea
                label: Excerpt
                rows: 3
            image:
                type: image
                label: Cover image
            url:
                type: url
                label: Link
            date:
                type: text
                label: Date
            readTime:
                type: text
                label: Read time
            category:
                type: text
                label: Category
            author:
                type: text
                label: Author
            avatar:
                type: image
                label: Author photo
        default:
