title: Three-column post cards
description: Heading left and a "view all" link right, then a three-column grid of cover-image cards
category: blog
fields:
    heading:
        type: text
        label: Heading
        required: true
        default: "Latest from Crate"
    intro:
        type: textarea
        label: Intro
        rows: 2
        default: "Counting, ordering and the quiet math of a small grocery, from the people who build the shelf-count app."
    linkText:
        type: text
        label: Link text
        default: "View all"
    linkUrl:
        type: url
        label: Link URL
        default: "/blog"
    posts:
        type: repeater
        label: Posts
        source: collections.posts
        add_button_label: Add post
        item_label: title
        sub_fields:
            title:
                type: text
                label: Title
            excerpt:
                type: textarea
                label: Excerpt
                rows: 3
            image:
                type: image
                label: Cover image
            url:
                type: url
                label: Link
            date:
                type: text
                label: Date
            readTime:
                type: text
                label: Read time
            category:
                type: text
                label: Category
            author:
                type: text
                label: Author
            avatar:
                type: image
                label: Author photo
        default:
            - title: "Counting a walk-in cooler in 12 minutes"
              excerpt: "Shelf order, not alphabetical order. How one Boise store counts 340 SKUs before the morning delivery."
              image: "/images/blocks/cover-04.jpg"
              url: "/blog/walk-in-cooler-count"
              date: "Sep 18, 2026"
              readTime: "5 min"
              category: "Operations"
              author: "Sam Nakamura"
              avatar: "https://assets.ui.sh/avatars/3.webp?size=160"
            - title: "Why shelf tags now print on a Tuesday cadence"
              excerpt: "Vendor price changes land Monday night. Printing once, the next morning, cut reprints by 71%."
              image: "/images/blocks/cover-02.jpg"
              url: "/blog/shelf-tags-tuesday"
              date: "Sep 10, 2026"
              readTime: "4 min"
              category: "Product"
              author: "Casey Alvarez"
              avatar: "https://assets.ui.sh/avatars/8.webp?size=160"
            - title: "Shrink is a scheduling problem"
              excerpt: "Most of what a grocer throws away was ordered on the wrong day. A long look at the data from 212 stores."
              image: "/images/blocks/cover-05.jpg"
              url: "/blog/shrink-scheduling"
