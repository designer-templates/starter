title: FAQ — by topic
description: Left opener, then two topic columns with their own accordions
category: faq
fields:
    heading:
        type: text
        label: Heading
        default: "Answers for owners of 2 to 200 units"
        required: true
    intro:
        type: textarea
        label: Intro
        description: One or two lines under the heading. Clear to hide.
        rows: 2
        default: "How billing works, and what week one on Gable is like."
    topicFirst:
        type: text
        label: First topic
        description: Heading over the first column.
        default: "Billing"
    topicSecond:
        type: text
        label: Second topic
        description: Heading over the second column.
        default: "Getting set up"
    questions:
        type: repeater
        label: Questions
        add_button_label: "Add question"
        item_label: question
        sub_fields:
            topic:
                type: select
                label: Topic
                default: first
                options:
                    first: First topic
                    second: Second topic
            question:
                type: text
                label: Question
                default: "A question"
            answer:
                type: textarea
                label: Answer
                rows: 3
                default: "A clear, direct answer."
        default:
            - topic: first
              question: "How is Gable priced?"
              answer: "Gable is $12 per unit per month with a $29 minimum, billed on the first. Owners with more than 100 units pay $9 per unit and get a dedicated account lead."
            - topic: first
              question: "Do tenants pay a fee for online rent?"
              answer: "Bank transfers are free for tenants and settle in two business days. Card payments carry a 2.9% fee that you can absorb or pass through with one setting."
            - topic: first
              question: "Who answers when a payment fails?"
              answer: "A person on our billing team, 8:00 AM to 6:00 PM ET on weekdays, usually within 20 minutes. A failed transfer retries after three business days and the tenant is told either way."
            - topic: second
              question: "Can we import leases from a spreadsheet?"
              answer: "Yes. Upload a sheet with unit, tenant, rent, and lease dates and Gable builds the ledgers with balances as of the day you switch. Most owners import a building in about 15 minutes."
            - topic: second
              question: "How do tenants get access?"
              answer: "Each tenant receives a text and an email with a link to set a password. They can see their ledger, pay rent, and file a maintenance request from any phone."
            - topic: second
              question: "Is our financial data secure?"
              answer: "Bank connections use tokenized access, so Gable never stores account credentials. Data is encrypted at rest in a US data center and covered by a SOC 2 Type II report."
