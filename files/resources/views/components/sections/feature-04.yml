title: Features — sticky board + list
description: A product screenshot that stays put on the left, five features with hairline dividers on the right
category: features
fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Project boards"
    heading:
        type: text
        label: Heading
        default: "Every drawing set, in one of three columns"
        required: true
    intro:
        type: textarea
        label: Intro
        rows: 3
        default: "Sumac keeps a studio’s active projects on one board — what is being drafted, what is waiting on a client, and what has been approved — so Monday stand-up takes 9 minutes."
    image:
        type: image
        label: Product image
        description: Your screenshot, framed as a window that stays put while the list scrolls. 4:3 works best.
        default: "/images/blocks/dashboard-board.jpg"
    imageAlt:
        type: text
        label: Image alt text
        default: "The Sumac studio board: drafting, with client and approved columns"
    items:
        type: repeater
        label: Features
        description: Icons are inline SVG — a 24×24 viewBox at stroke-width 1.5 keeps them consistent.
        add_button_label: "Add feature"
        item_label: title
        sub_fields:
            icon:
                type: textarea
                label: Icon (inline SVG)
                rows: 3
                default: "<svg viewBox='0 0 24 24' class='size-5' fill='none' stroke='currentColor' stroke-width='1.5' aria-hidden='true'><path stroke-linecap='round' stroke-linejoin='round' d='M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z'/></svg>"
            title:
                type: text
                label: Title
                default: "A feature"
            description:
                type: textarea
                label: Text
                rows: 2
                default: "One sentence on what it does."
        default:
            - icon: "<svg viewBox='0 0 24 24' class='size-5' fill='none' stroke='currentColor' stroke-width='1.5' aria-hidden='true'><path stroke-linecap='round' stroke-linejoin='round' d='M9 4.5v15m6-15v15m-10.875 0h15.75c.621 0 1.125-.504 1.125-1.125V5.625c0-.621-.504-1.125-1.125-1.125H4.125C3.504 4.5 3 5.004 3 5.625v12.75c0 .621.504 1.125 1.125 1.125Z'/></svg>"
              title: "Columns that mean something"
              description: "Drafting, with client, approved. A set moves right only when a person moves it, and the board remembers who."
            - icon: "<svg viewBox='0 0 24 24' class='size-5' fill='none' stroke='currentColor' stroke-width='1.5' aria-hidden='true'><path stroke-linecap='round' stroke-linejoin='round' d='M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.076-4.076a1.526 1.526 0 0 1 1.037-.443 48.282 48.282 0 0 0 5.68-.494c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z'/></svg>"
              title: "Client comments land on the card"
              description: "Markups from the review link show up on the card with the sheet number, so nothing lives in an email thread."
            - icon: "<svg viewBox='0 0 24 24' class='size-5' fill='none' stroke='currentColor' stroke-width='1.5' aria-hidden='true'><path stroke-linecap='round' stroke-linejoin='round' d='M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5'/></svg>"
              title: "Due dates that watch the permit office"
              description: "Set the county’s review window once; Sumac pushes a due date when the office is closed."
            - icon: "<svg viewBox='0 0 24 24' class='size-5' fill='none' stroke='currentColor' stroke-width='1.5' aria-hidden='true'><path stroke-linecap='round' stroke-linejoin='round' d='m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10'/></svg>"
              title: "Approval is a signature, not a thumbs-up"
              description: "The client signs the set from the review link; the card moves to Approved and the PDF gets the stamp."
            - icon: "<svg viewBox='0 0 24 24' class='size-5' fill='none' stroke='currentColor' stroke-width='1.5' aria-hidden='true'><path stroke-linecap='round' stroke-linejoin='round' d='M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z'/></svg>"
              title: "Hours roll into the invoice"
              description: "Time logged against a card flows to billing when the set is approved, at the phase rate you set."
