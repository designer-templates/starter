title: Features — checklist and image
description: Heading and a checklist on the left, an image on the right
category: features
fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Why it works"
    heading:
        type: text
        label: Heading
        default: "The schedule and the people on it, in one place"
        required: true
    description:
        type: textarea
        label: Description
        description: Clear to hide.
        rows: 3
        default: "Availability, hours caps and training live next to the shifts, so the week you publish is one everyone can actually work."
    features:
        type: repeater
        label: Checklist
        source: "collections.features"
        add_button_label: "Add item"
        item_label: title
        sub_fields:
            icon:
                type: textarea
                label: Icon (inline SVG)
                rows: 3
                default: ""
            title:
                type: text
                label: Title
                default: "A short benefit"
            description:
                type: textarea
                label: Description
                rows: 2
                default: ""
    showButton:
        type: toggle
        label: Show button
        default: "1"
    buttonText:
        type: text
        label: Button text
        default: "See every feature"
    buttonUrl:
        type: url
        label: Button link
        default: "/#features"
    image:
        type: image
        label: Image
        default: "/images/schedule-week.svg"
    imageAlt:
        type: text
        label: Image alt text
        default: "A weekly schedule with shifts for eight people"
