title: Hero — centred statement with drifting wordmarks and photographs
description: A badge, headline, intro and two buttons centred; beneath them a strip of wordmarks drifting one way and a row of tall photographs drifting the other, cut off by the section's edge
category: heroes
fields:
    showBadge:
        type: toggle
        label: Show the badge
        default: "1"
    badgeText:
        type: text
        label: Badge text
        default: "Now with retainers and deposits"
    heading:
        type: text
        label: Heading
        default: "Run the studio, not the spreadsheet"
        required: true
    text:
        type: textarea
        label: Intro
        rows: 3
        default: "Hollen keeps every project, hour and invoice for a design studio in one place, so Friday is for the work and not the books."
    buttonText:
        type: text
        label: Primary button text
        default: "Start free"
    buttonLink:
        type: url
        label: Primary button link
        default: "/signup"
    buttonText2:
        type: text
        label: Secondary button text
        description: Clear to hide.
        default: "See a live studio"
    buttonLink2:
        type: url
        label: Secondary button link
        default: "/demo"
    logosLabel:
        type: text
        label: Line over the wordmarks
        description: Clear to hide.
        default: "Used by 1,400 studios"
    logos:
        type: repeater
        label: Wordmarks
        source: "collections.logos"
        add_button_label: "Add wordmark"
        item_label: name
        sub_fields:
            name:
                type: text
                label: Name
                default: "New company"
            icon:
                type: textarea
                label: Mark (inline SVG)
                rows: 3
                default: ""
        default:
            - name: "Upland"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path fill-rule='evenodd' d='M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z'/></svg>"
            - name: "Verity"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M9.4 20.2 2.6 13.4l2.9-2.9 3.9 3.9L18.5 4.3l2.9 2.9Z'/></svg>"
            - name: "Valence"
              icon: "<svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='3.5' fill='currentColor'/><ellipse cx='12' cy='12' rx='9.5' ry='4' fill='none' stroke='currentColor' stroke-width='1.75' transform='rotate(-30 12 12)'/></svg>"
            - name: "Granary"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><circle cx='7.5' cy='7.5' r='3.75'/><circle cx='16.5' cy='7.5' r='3.75'/><circle cx='7.5' cy='16.5' r='3.75'/><circle cx='16.5' cy='16.5' r='3.75'/></svg>"
            - name: "Rosewood"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M12 3 21 10.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5Z'/></svg>"
            - name: "Cinder"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><rect x='3' y='9' width='13' height='6' rx='3'/><circle cx='19.5' cy='12' r='2.5'/></svg>"
            - name: "Perch"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><rect x='5' y='5' width='14' height='14' rx='2.5' transform='rotate(45 12 12)'/></svg>"
            - name: "Tallis"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><rect x='3' y='10.25' width='18' height='3.5' rx='1.75'/><rect x='3' y='10.25' width='18' height='3.5' rx='1.75' transform='rotate(60 12 12)'/><rect x='3' y='10.25' width='18' height='3.5' rx='1.75' transform='rotate(120 12 12)'/></svg>"
    images:
        type: repeater
        label: Photographs
        description: Tall tiles (4:5) that drift across the bottom of the hero. Six to eight work best.
        add_button_label: "Add photograph"
        item_label: alt
        sub_fields:
            image:
                type: image
                label: Photograph
                default: "/images/blocks/workspace-01.jpg"
            alt:
                type: text
                label: Description
                default: "What the photograph shows"
        default:
            - image: "/images/blocks/workspace-01.jpg"
              alt: "People at desks in a bright studio"
            - image: "/images/blocks/cover-01.jpg"
              alt: "A notebook and pencil on an oak desk"
            - image: "/images/blocks/portrait-01.jpg"
              alt: "A designer at her desk"
            - image: "/images/blocks/cover-03.jpg"
              alt: "White concrete stairs in sunlight"
            - image: "/images/blocks/workspace-02.jpg"
              alt: "Two people at a whiteboard"
            - image: "/images/blocks/cover-05.jpg"
              alt: "Green leaves against a white wall"
            - image: "/images/blocks/portrait-02.jpg"
              alt: "A designer reviewing work at a desk"
            - image: "/images/blocks/cover-04.jpg"
              alt: "Ceramic cups on a shelf"
