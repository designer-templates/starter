title: Hero — image and stats
description: Left-aligned heading beside its paragraph, a wide image, and a row of figures
category: heroes
fields:
    heading:
        type: text
        label: Heading
        default: "One schedule for the whole crew"
        required: true
    text:
        type: textarea
        label: Description
        rows: 3
        default: "Starter puts the week, the swaps and the time clock in one place, so the schedule on the wall and the one in every pocket finally agree."
    buttonText:
        type: text
        label: Primary button text
        description: Clear to hide.
        default: "Start free"
    buttonLink:
        type: url
        label: Primary button link
        default: "/pricing"
    buttonText2:
        type: text
        label: Secondary button text
        description: Clear to hide.
        default: "Book a demo"
    buttonLink2:
        type: url
        label: Secondary button link
        default: "/contact"
    image:
        type: image
        label: Image
        default: "/images/schedule-panorama.svg"
    imageAlt:
        type: text
        label: Image alt text
        default: "A wide view of a weekly schedule"
    stats:
        type: repeater
        label: Stats
        source: "collections.stats"
        add_button_label: "Add stat"
        item_label: label
        sub_fields:
            value:
                type: text
                label: Value
                default: "1,000"
            label:
                type: text
                label: Label
                default: "What this number measures"
