title: Hero — email signup
description: Centered heading with an email signup row and a wide image below
category: heroes
fields:
    heading:
        type: text
        label: Heading
        default: "Be first on the schedule"
        required: true
    text:
        type: textarea
        label: Description
        rows: 3
        default: "We are opening a few hundred new accounts a week. Leave your email and we will send an invite as soon as your workspace is ready."
    inputPlaceholder:
        type: text
        label: Email input placeholder
        default: "you@yourshop.com"
    buttonText:
        type: text
        label: Button text
        default: "Join the waitlist"
    note:
        type: text
        label: Small note below the form
        description: Clear to hide.
        default: "Free while in early access. No card required."
    image:
        type: image
        label: Image
        default: "/images/schedule-wide.svg"
    imageAlt:
        type: text
        label: Image alt text
        default: "A published weekly schedule for six people"
