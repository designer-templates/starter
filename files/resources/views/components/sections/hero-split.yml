title: Hero — split
description: Heading and buttons on the left, an image on the right
category: heroes
fields:
    heading:
        type: text
        label: Heading
        default: "Schedules your team actually sees"
        required: true
    text:
        type: textarea
        label: Description
        rows: 3
        default: "Starter builds the week from the last one, publishes it to every phone, and approves the swaps that fit. Sunday nights go back to being Sunday nights."
    buttonText:
        type: text
        label: Primary button text
        description: Clear to hide.
        default: "Start free"
    buttonLink:
        type: url
        label: Primary button link
        default: "/pricing"
    buttonText2:
        type: text
        label: Secondary button text
        description: Clear to hide.
        default: "See how it works"
    buttonLink2:
        type: url
        label: Secondary button link
        default: "/#features"
    image:
        type: image
        label: Image
        default: "/images/schedule-week.svg"
    imageAlt:
        type: text
        label: Image alt text
        default: "A weekly schedule with shifts for eight people"
