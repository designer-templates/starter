title: Logos — centred row
description: A short line of proof over a single balanced row of marks and wordmarks
category: logos
fields:
    heading:
        type: text
        label: Heading
        description: The line above the row. Clear to hide.
        default: "Runs the schedules at 1,400 shops"
    items:
        type: repeater
        label: Logos
        source: "collections.logos"
        add_button_label: "Add logo"
        item_label: name
        description: Each mark is inline SVG — a 24×24 viewBox on currentColor keeps them consistent.
        sub_fields:
            name:
                type: text
                label: Company name
                default: "Company"
            icon:
                type: textarea
                label: Mark (inline SVG)
                rows: 3
                default: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><rect x='3' y='3' width='18' height='18' rx='5'/></svg>"
        default:
            - name: "Flint"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path fill-rule='evenodd' d='M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm5 5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z'/></svg>"
            - name: "Pillar"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><rect x='3' y='8' width='4' height='13' rx='2'/><rect x='10' y='3' width='4' height='18' rx='2'/><rect x='17' y='8' width='4' height='13' rx='2'/></svg>"
            - name: "Spire"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M11.1 3.6a1 1 0 0 1 1.8 0l7.6 14.7a1 1 0 0 1-.9 1.5H4.4a1 1 0 0 1-.9-1.5Z'/></svg>"
            - name: "Rook"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><circle cx='9' cy='12' r='7'/><circle cx='16' cy='12' r='7' opacity='.5'/></svg>"
            - name: "Orchard"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M13.5 3a9 9 0 1 0 7.2 14.4A7.5 7.5 0 0 1 13.5 3Z'/></svg>"
            - name: "Prism"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M12 2.5 20.2 7.25v9.5L12 21.5l-8.2-4.75v-9.5Z'/></svg>"
            - name: "Lark"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M20.5 3.5c0 9.5-4.8 17-13.5 17-2.2 0-3.5-1.8-3.5-3.5C3.5 8.7 11 3.5 20.5 3.5Z'/></svg>"
            - name: "Knoll"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M3 21v-7a9 9 0 0 1 18 0v7h-4.5v-7a4.5 4.5 0 0 0-9 0v7Z'/></svg>"
