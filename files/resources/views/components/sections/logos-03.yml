title: Logos — bordered grid
description: A hairline-ruled grid of wordmark cells with a caption of proof beneath
category: logos
fields:
    items:
        type: repeater
        label: Logos
        source: "collections.logos"
        add_button_label: "Add logo"
        item_label: name
        description: Each mark is inline SVG — a 24×24 viewBox on currentColor keeps them consistent. The grid runs two across on phones and four on larger screens.
        sub_fields:
            name:
                type: text
                label: Company name
                default: "Company"
            icon:
                type: textarea
                label: Mark (inline SVG)
                rows: 3
                default: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><rect x='3' y='3' width='18' height='18' rx='5'/></svg>"
        default:
            - name: "Corvid"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M3 4.5 11 12l-8 7.5Z'/><path d='M21 4.5 13 12l8 7.5Z' opacity='.5'/></svg>"
            - name: "Fenner"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M3.5 3h13.5L3.5 16.5Z'/><path d='M20.5 21H7l13.5-13.5Z'/></svg>"
            - name: "Marlow"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path fill-rule='evenodd' d='M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19Zm0 2.25a7.25 7.25 0 1 1 0 14.5 7.25 7.25 0 0 1 0-14.5Z'/><circle cx='12' cy='12' r='3.5'/></svg>"
            - name: "Cassia"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><circle cx='12' cy='7' r='4.5'/><circle cx='12' cy='17' r='4.5'/><circle cx='7' cy='12' r='4.5'/><circle cx='17' cy='12' r='4.5'/><circle cx='12' cy='12' r='3'/></svg>"
            - name: "Norwood"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M12 2 16.5 12h-9Z'/><path d='M12 22 7.5 12h9Z' opacity='.45'/></svg>"
            - name: "Thorne"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7Z'/></svg>"
            - name: "Oster"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M12 12V3a9 9 0 0 1 9 9Z'/><path d='M12 12h9a9 9 0 0 1-9 9Z' opacity='.5'/><path d='M12 12v9a9 9 0 0 1-9-9Z'/><path d='M12 12H3a9 9 0 0 1 9-9Z' opacity='.5'/></svg>"
            - name: "Marston"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M3 8.5 12 3.5l9 5-9 5Z'/><path d='m3 15.5 9 5 9-5' fill='none' stroke='currentColor' stroke-width='1.75' stroke-linejoin='round'/></svg>"
    caption:
        type: text
        label: Caption
        description: The line under the grid. Clear to hide.
        default: "Support teams at 860 software companies answer from Deskline."
