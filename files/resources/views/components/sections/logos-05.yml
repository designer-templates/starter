title: Logos — quote and row
description: One customer line set large with its attribution, a row of wordmarks and a link to the stories
category: logos
fields:
    quote:
        type: textarea
        label: Quote
        rows: 3
        description: Written without quotation marks — the block adds them.
        default: "We moved 14 locations onto Crewbook in one weekend, and Monday's schedule was already posted. Managers stopped texting me at 6:00 AM, which is the only review that matters."
    name:
        type: text
        label: Name
        default: "Morgan Okafor"
    role:
        type: text
        label: Role and company
        default: "Director of Operations, Sextant"
    items:
        type: repeater
        label: Logos
        source: "collections.logos"
        add_button_label: "Add logo"
        item_label: name
        description: Each mark is inline SVG — a 24×24 viewBox on currentColor keeps them consistent.
        sub_fields:
            name:
                type: text
                label: Company name
                default: "Company"
            icon:
                type: textarea
                label: Mark (inline SVG)
                rows: 3
                default: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><rect x='3' y='3' width='18' height='18' rx='5'/></svg>"
        default:
            - name: "Sextant"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M3.5 20.5v-17a17 17 0 0 1 17 17Z'/></svg>"
            - name: "Tundra"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><circle cx='5' cy='5' r='2.25'/><circle cx='12' cy='5' r='2.25'/><circle cx='19' cy='5' r='2.25'/><circle cx='5' cy='12' r='2.25'/><circle cx='12' cy='12' r='2.25'/><circle cx='19' cy='12' r='2.25'/><circle cx='5' cy='19' r='2.25'/><circle cx='12' cy='19' r='2.25'/><circle cx='19' cy='19' r='2.25'/></svg>"
            - name: "Bastion"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M12 2.5 20 5.5v6c0 5-3.5 8.6-8 10-4.5-1.4-8-5-8-10v-6Z'/></svg>"
            - name: "Ingot"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path fill-rule='evenodd' d='M4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11A1.5 1.5 0 0 1 4.5 5Zm2.5 4v6h10V9Z'/></svg>"
            - name: "Mica"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><path d='M10.5 3a9 9 0 0 0 0 18Z'/><path d='M13.5 3a9 9 0 0 1 0 18Z' opacity='.5'/></svg>"
            - name: "Ursa"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><circle cx='9' cy='14.5' r='6.5'/><circle cx='18' cy='6' r='3.5'/></svg>"
            - name: "Bellwether"
              icon: "<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3.5 21 19.5H3Z' fill='none' stroke='currentColor' stroke-width='1.75' stroke-linejoin='round'/><circle cx='12' cy='14' r='2.5' fill='currentColor'/></svg>"
            - name: "Selkirk"
              icon: "<svg viewBox='0 0 24 24' class='fill-current' aria-hidden='true'><rect x='2' y='10.25' width='20' height='3.5' rx='1.75' transform='rotate(45 12 12)'/><rect x='2' y='10.25' width='20' height='3.5' rx='1.75' transform='rotate(-45 12 12)'/></svg>"
    linkText:
        type: text
        label: Link text
        description: Clear to drop the link.
        default: "Read the customer stories"
    linkUrl:
        type: url
        label: Link URL
        default: "/customers"
