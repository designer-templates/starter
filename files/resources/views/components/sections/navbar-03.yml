title: Header — mega panel
description: Brand and links on the left, Log in and one compact action right; a link with children opens a wide two-column panel with icon rows and a "latest" card
category: headers
fields:
    brand:
        type: text
        label: Brand name
        default: "Brindle"
    links:
        type: repeater
        label: Navigation links
        description: "Nest links under an item to turn it into the wide panel. Stored in site.json."
        source: site.nav_links
        nestable: true
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
            description:
                type: text
                label: Description
                description: Shown under the title inside the panel.
                default: ""
            icon:
                type: text
                label: Icon
                description: Inline SVG for the row's icon tile inside the panel. Leave empty for the default glyph.
                default: ""
        default:
            - text: "Platform"
              url: "#"
              children:
                  - text: "Scheduling"
                    url: "/platform/scheduling"
                    description: "Build the week in minutes, publish once"
                    icon: '<svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>'
                  - text: "Time clock"
                    url: "/platform/time-clock"
                    description: "Punch in from any phone, geofenced"
                    icon: '<svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>'
                  - text: "Shift swaps"
                    url: "/platform/swaps"
                    description: "Staff trade, managers approve in one tap"
                    icon: '<svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/></svg>'
                  - text: "Payroll sync"
                    url: "/platform/payroll"
                    description: "Approved hours flow to payroll nightly"
                    icon: '<svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375C2.25 4.9 2.9 4.25 3.75 4.25h16.5c.83 0 1.5.65 1.5 1.375V6m-19.5 0h19.5m0 0v9a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V6m9 4.5a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5Z"/></svg>'
                  - text: "Compliance"
                    url: "/platform/compliance"
                    description: "Break and overtime rules, by state"
                    icon: '<svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 12 12 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.286Z"/></svg>'
                  - text: "Reports"
                    url: "/platform/reports"
                    description: "Labor cost against sales, by the hour"
                    icon: '<svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>'
            - text: "Pricing"
              url: "/pricing"
            - text: "Customers"
              url: "/customers"
            - text: "Company"
              url: "/about"
    latestLabel:
        type: text
        label: Latest card label
        default: "Latest"
    latestImage:
        type: image
        label: Latest card image
        default: "/images/blocks/cover-03.jpg"
    latestTitle:
        type: text
        label: Latest card title
        default: "Brindle 3.1: shift swaps from the phone"
    latestLinkText:
        type: text
        label: Latest card link text
        default: "Read the release notes"
    latestLinkUrl:
        type: url
        label: Latest card link
        default: "/changelog"
    showLatest:
        type: toggle
        label: Show the latest card
        description: The card on the right of the panel.
        default: "1"
    signInText:
        type: text
        label: Log in text
        description: Clear to hide.
        default: "Log in"
    signInLink:
        type: url
        label: Log in link
        default: "#"
    ctaText:
        type: text
        label: Button text
        description: Clear to hide.
        default: "Book a demo"
    ctaLink:
        type: url
        label: Button link
        default: "/contact"
