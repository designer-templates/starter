title: Header — minimal
description: Brand left, links right with a hairline that slides under the hovered link, Log in and one outlined compact button; a sheet under the bar on phones
category: headers
fields:
    brand:
        type: text
        label: Brand name
        default: "Meadowlark"
    links:
        type: repeater
        label: Navigation links
        description: "Nest links under an item to turn it into a dropdown. Stored in site.json."
        source: site.nav_links
        nestable: true
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
            description:
                type: text
                label: Description
                description: Shown under the title inside a dropdown.
                default: ""
        default:
            - text: "Product"
              url: "#"
              children:
                  - text: "Rent collection"
                    url: "/product/rent"
                    description: "ACH autopay, late fees by your rules"
                  - text: "Maintenance"
                    url: "/product/maintenance"
                    description: "Tenants text a photo, you get a work order"
                  - text: "Leases"
                    url: "/product/leases"
                    description: "Leases by state, signed on a phone"
            - text: "Pricing"
              url: "/pricing"
            - text: "Blog"
              url: "/blog"
            - text: "About"
              url: "/about"
    signInText:
        type: text
        label: Log in text
        description: Clear to hide.
        default: "Log in"
    signInLink:
        type: url
        label: Log in link
        default: "#"
    ctaText:
        type: text
        label: Button text
        description: Clear to hide.
        default: "Book a demo"
    ctaLink:
        type: url
        label: Button link
        default: "/contact"
