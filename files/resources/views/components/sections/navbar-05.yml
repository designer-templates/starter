title: Header — utility strip
description: A thin dark announcement strip that dismisses, over a bar with the brand, links, a search link with its shortcut chip, Log in and one compact action
category: headers
fields:
    brand:
        type: text
        label: Brand name
        default: "Ferrous"
    stripMessage:
        type: text
        label: Announcement
        description: The thin dark strip above the bar. Clear to remove it.
        default: "Ferrous 2.4 is out: point-in-time restore on every plan."
    stripLinkText:
        type: text
        label: Announcement link text
        description: Clear to hide the link.
        default: "Read the changelog"
    stripLinkUrl:
        type: url
        label: Announcement link
        default: "/changelog"
    stripDismissible:
        type: toggle
        label: Show dismiss button
        description: Dismissing is remembered for the visit.
        default: "1"
    links:
        type: repeater
        label: Navigation links
        description: "Nest links under an item to turn it into a dropdown. Stored in site.json."
        source: site.nav_links
        nestable: true
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
            description:
                type: text
                label: Description
                description: Shown under the title inside a dropdown.
                default: ""
        default:
            - text: "Product"
              url: "#"
              children:
                  - text: "Postgres"
                    url: "/product/postgres"
                    description: "Managed clusters in 6 US regions"
                  - text: "Branching"
                    url: "/product/branching"
                    description: "A copy of production for every pull request"
                  - text: "Backups"
                    url: "/product/backups"
                    description: "Restore to any second in the last 30 days"
            - text: "Pricing"
              url: "/pricing"
            - text: "Docs"
              url: "/docs"
            - text: "Customers"
              url: "/customers"
    searchText:
        type: text
        label: Search text
        description: Clear to hide the search link.
        default: "Search"
    searchShortcut:
        type: text
        label: Search shortcut chip
        description: Clear to hide the chip.
        default: "⌘K"
    searchLink:
        type: url
        label: Search link
        default: "/search"
    signInText:
        type: text
        label: Log in text
        description: Clear to hide.
        default: "Log in"
    signInLink:
        type: url
        label: Log in link
        default: "#"
    ctaText:
        type: text
        label: Button text
        description: Clear to hide.
        default: "Start free"
    ctaLink:
        type: url
        label: Button link
        default: "/pricing"
