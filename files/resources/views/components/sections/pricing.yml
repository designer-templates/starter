title: Pricing — tier cards
description: Three bordered tier cards with feature checklists; the featured plan is outlined
category: pricing
fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Pricing"
    heading:
        type: text
        label: Heading
        default: "Simple, per-location pricing"
        required: true
    subheading:
        type: textarea
        label: Subheading
        description: Short line under the heading. Clear to hide.
        rows: 2
        default: "Three plans that grow with the roster. Switch or cancel from the billing page whenever you like."
    plans:
        type: repeater
        label: Plans
        source: "collections.plans"
        add_button_label: "Add plan"
        item_label: name
        description: Features are one per line.
        sub_fields:
            name:
                type: text
                label: Plan name
                default: "New plan"
            price:
                type: text
                label: Price
                default: "$29"
            period:
                type: text
                label: Period
                default: "/month"
            description:
                type: text
                label: Description
                default: "Who this plan is for."
            features:
                type: textarea
                label: Features (one per line)
                rows: 5
                default: "1 location\nUp to 10 people"
            ctaText:
                type: text
                label: Button text
                default: "Start free"
            ctaLink:
                type: url
                label: Button link
                default: "#"
            featured:
                type: select
                label: Featured plan
                default: "no"
                options:
                    yes: "Yes"
                    no: "No"
