title: Stats — ledger
description: A bordered card of metric rows, each with a value, a change and a sparkline, under a mono header row and over a reporting-period line
category: stats
fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Short label above the heading. Clear to hide.
        default: "Operations"
    heading:
        type: text
        label: Heading
        required: true
        default: "Every payment, counted the same way"
    intro:
        type: textarea
        label: Intro
        description: One or two lines under the heading. Clear to hide.
        rows: 2
        default: "Clearfork reconciles each authorization against the processor and the bank, so the numbers here are the ones your finance close will see."
    colMetric:
        type: text
        label: First column head
        default: "Metric"
    colValue:
        type: text
        label: Value column head
        default: "Quarter to date"
    colDelta:
        type: text
        label: Change column head
        default: "vs. last quarter"
    colTrend:
        type: text
        label: Trend column head
        default: "Last 12 weeks"
    metrics:
        type: repeater
        label: Rows
        source: "collections.stats"
        add_button_label: "Add row"
        item_label: label
        description: Six rows fill the ledger. Points are comma-separated numbers, oldest first; the sparkline is drawn from them, and a row without points or a change shows a dash instead.
        sub_fields:
            label:
                type: text
                label: Metric
                default: "Authorizations"
            value:
                type: text
                label: Value
                default: "184,212"
            delta:
                type: text
                label: Change
                default: "+6.1%"
            points:
                type: text
                label: Trend points
                default: "61,64,63,68,70,69,74,76,75,79,82,84"
        default:
            - label: "Authorizations"
              value: "184,212"
              delta: "+6.1%"
              points: "61,64,63,68,70,69,74,76,75,79,82,84"
            - label: "Approval rate"
              value: "96.4%"
              delta: "+0.8 pt"
              points: "94.9,95.1,95.0,95.4,95.6,95.5,95.9,96.0,96.2,96.1,96.3,96.4"
            - label: "Median latency"
              value: "212 ms"
              delta: "−14 ms"
              points: "241,238,236,230,228,226,222,220,218,215,213,212"
            - label: "Chargebacks"
              value: "0.31%"
              delta: "−0.05 pt"
              points: "0.38,0.37,0.37,0.36,0.35,0.35,0.34,0.33,0.33,0.32,0.31,0.31"
            - label: "Payouts settled"
              value: "$2.84M"
              delta: "+9.2%"
              points: "2.31,2.36,2.40,2.44,2.49,2.55,2.58,2.63,2.69,2.74,2.79,2.84"
            - label: "Active merchants"
              value: "1,317"
              delta: "+41"
              points: "1204,1211,1219,1226,1240,1248,1257,1269,1281,1290,1305,1317"
    period:
        type: text
        label: Reporting period
        description: The line at the foot of the ledger. Clear to hide.
        default: "Quarter to date, Jul 1–Sep 12, 2026 · refreshed nightly at 2:00 AM ET"
