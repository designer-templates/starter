title: Team — directory
description: Hairline rows of people with a small portrait, role, location and link, grouped by department
category: team
fields:
    eyebrow:
        type: text
        label: Eyebrow
        description: Small label above the heading. Clear to hide.
        default: "Directory"
    heading:
        type: text
        label: Heading
        default: "Everyone at Moraine"
        required: true
    intro:
        type: textarea
        label: Intro
        description: One or two sentences under the heading. Clear to hide.
        rows: 3
        default: "Eight of us in five cities, and one Slack channel called #receipts. Each name links to what that person is working on this quarter."
    summary:
        type: text
        label: Summary line
        description: Short mono line at the right of the opener. Clear to hide.
        default: "8 people · 5 cities"
    members:
        type: repeater
        label: People
        description: Keep people in the same department next to each other; a department label prints whenever it changes.
        source: "collections.team"
        add_button_label: "Add person"
        item_label: name
        sub_fields:
            image:
                type: image
                label: Portrait
                default: "https://assets.ui.sh/avatars/5.webp?size=160"
            name:
                type: text
                label: Name
                default: "A name"
            role:
                type: text
                label: Role
                default: "Role"
            location:
                type: text
                label: Location
                default: "Denver, CO"
            department:
                type: text
                label: Department
                default: "Engineering"
            linkUrl:
                type: url
                label: Link
                default: "#"
