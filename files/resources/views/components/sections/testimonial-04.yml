title: Testimonials — featured and supporting
description: A wide featured quote card with a portrait and company mark over three compact quote cards
category: testimonials
fields:
    heading:
        type: text
        label: Heading
        default: "What store teams say after the first month"
        required: true
    intro:
        type: textarea
        label: Intro
        description: One or two lines under the heading. Clear to hide.
        rows: 2
        default: "Solace is the shared inbox for stores that answer on email, chat, and text. Here is what changed for four of them."
    testimonials:
        type: repeater
        label: Quotes
        source: "collections.testimonials"
        add_button_label: "Add quote"
        item_label: name
        description: A featured row renders as the wide card; the others fill the row of three beneath. The company mark is inline SVG on currentColor.
        sub_fields:
            featured:
                type: select
                label: Featured
                default: "no"
                options:
                    "yes": Featured (wide card)
                    "no": Supporting (compact card)
            quote:
                type: textarea
                label: Quote
                rows: 3
                default: "A short quote about the product."
            name:
                type: text
                label: Name
                default: "A name"
            role:
                type: text
                label: Role
                default: "Role, Company"
            avatar:
                type: image
                label: Portrait
                default: "https://assets.ui.sh/avatars/1.webp?size=160"
            company:
                type: text
                label: Company name
                default: "Company"
            logo:
                type: textarea
                label: Company mark (inline SVG)
                rows: 3
                default: "<svg viewBox='0 0 24 24' class='size-5 fill-current' aria-hidden='true'><rect x='3' y='3' width='18' height='18' rx='5'/></svg>"
        default:
            - featured: "yes"
              quote: "Solace put every channel in one queue and our first-reply time went from 6 hours to 41 minutes. The team in Columbus stopped dreading Mondays."
              name: "Rowan Hayes"
              role: "Head of support, Basil & Co"
              avatar: "https://assets.ui.sh/avatars/2.webp?size=160"
              company: "Basil & Co"
              logo: "<svg viewBox='0 0 24 24' class='size-5' fill='none' stroke='currentColor' stroke-width='2.25' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M4 20c0-9 5-14 16-16-2 11-7 16-16 16Z'/><path d='m4 20 10-10'/></svg>"
            - featured: "no"
              quote: "Order details sit right beside the message. No more hopping between six tabs to answer one question."
              name: "Skyler Kim"
              role: "Support lead, Tamsin Goods"
              avatar: "https://assets.ui.sh/avatars/5.webp?size=160"
              company: "Tamsin Goods"
              logo: "<svg viewBox='0 0 24 24' class='size-5 fill-current' aria-hidden='true'><circle cx='12' cy='12' r='9.5'/></svg>"
            - featured: "no"
              quote: "The saved replies picked up our tone within a week. Customers cannot tell which of us answered."
              name: "Reese Nakamura"
              role: "Co-founder, Sequoia Outfitters"
              avatar: "https://assets.ui.sh/avatars/10.webp?size=160"
              company: "Sequoia Outfitters"
              logo: "<svg viewBox='0 0 24 24' class='size-5 fill-current' aria-hidden='true'><path d='M12 2.5 20 20H4Z'/></svg>"
            - featured: "no"
              quote: "Assignment rules cut our missed tickets to zero across 3 stores. Nothing waits in an inbox nobody owns."
              name: "Emery Alvarez"
              role: "Operations manager, Wainwright Supply"
              avatar: "https://assets.ui.sh/avatars/13.webp?size=160"
              company: "Wainwright Supply"
              logo: "<svg viewBox='0 0 24 24' class='size-5 fill-current' aria-hidden='true'><rect x='3' y='3' width='18' height='18' rx='5'/></svg>"
